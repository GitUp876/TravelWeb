name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # No database service: the test settings use an in-memory SQLite database
    # and the deployment check never opens a connection, so a Postgres
    # container would only add startup time. Production runs on Postgres.
    env:
      # Not a real secret: long enough only to satisfy check --deploy in CI.
      DJANGO_SECRET_KEY: ci-ephemeral-key-7Qn4vZt2Lp9RmXe6Ub3Kd5Yw8Sa1Hj0Fg2Nc4Vx7Zq
      DJANGO_ALLOWED_HOSTS: localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Our requirements live in requirements/, so the default glob
          # (**/requirements.txt) matches nothing and setup-python fails the
          # job before it installs anything.
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ADMIN_URL: ci-only-path/
          DJANGO_SECURE_SSL_REDIRECT: "true"
      - name: Tests
        run: pytest
      - name: Static analysis
        run: bandit -c pyproject.toml -r apps config -ll
      - name: Dependency audit
        run: pip-audit -r requirements/base.txt
