# Local development only. Production runs the image against managed Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tours
      POSTGRES_PASSWORD: tours
      POSTGRES_DB: tours
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tours"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
