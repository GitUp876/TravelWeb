# Render Blueprint: everything the site runs on, declared in one place.
#
# In the Render dashboard choose New > Blueprint, pick this repository, and
# Render creates every resource below. Secrets are not in this file; see the
# environment group for the values to add once. Check each `plan` and
# `region` against current pricing before applying.
#
# What runs where:
#   web                     the site and the staff admin, with the photo disk
#   release-expired-holds   frees seats from abandoned checkouts
#   charge-due-instalments  charges payment-plan instalments that are due
#   staff-digest            emails Managers what needs attention
# All four read the same environment group, because the cron jobs boot the
# same production settings as the site and fail closed without them.

envVarGroups:
  - name: travelweb-shared
    envVars:
      # Signs sessions and guests' booking links. Generated once by Render;
      # rotating it invalidates every booking link already emailed.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: STRIPE_CURRENCY
        value: usd
      # Cron schedules below are UTC; this is the zone dates are shown in.
      - key: DJANGO_TIME_ZONE
        value: America/New_York
      # Render won't prompt for values inside a group, so after the first
      # apply, add these to this group in the dashboard, then redeploy.
      # Production refuses to boot until the first three are set.
      #   DJANGO_ALLOWED_HOSTS        example.com,www.example.com
      #   DJANGO_ADMIN_URL            an unguessable path ending in /
      #   SITE_BASE_URL               https://example.com
      #   SITE_NAME, SITE_TAGLINE, SITE_PHONE, SITE_EMAIL
      #   DJANGO_EMAIL_HOST_USER      Postmark server API token
      #   DJANGO_EMAIL_HOST_PASSWORD  the same token
      #   DJANGO_DEFAULT_FROM_EMAIL   bookings@example.com, on the verified domain
      #   DJANGO_ADMINS               who is emailed about errors, comma-separated
      #   STRIPE_SECRET_KEY           set both Stripe values together or
      #   STRIPE_WEBHOOK_SECRET       neither: one alone refuses to boot

databases:
  - name: travelweb-db
    # A paid instance (0.5 CPU, 1 GB): point-in-time recovery comes with it.
    plan: 0.5c-1g
    region: virginia
    ipAllowList: []                        # no access from outside Render

services:
  - type: web
    name: travelweb
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    healthCheckPath: /healthz
    # The image does not migrate on start, so a deploy applies its migrations
    # before any new code takes traffic.
    preDeployCommand: python manage.py migrate --noinput
    disk:
      name: media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - fromGroup: travelweb-shared
      - key: DATABASE_URL
        fromDatabase:
          name: travelweb-db
          property: connectionString
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media

  - type: cron
    name: release-expired-holds
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    schedule: "*/5 * * * *"
    dockerCommand: python manage.py release_expired_holds
    envVars:
      - fromGroup: travelweb-shared
      - key: DATABASE_URL
        fromDatabase:
          name: travelweb-db
          property: connectionString

  - type: cron
    name: charge-due-instalments
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    # 14:00 and 22:00 UTC: mid-morning and early evening in US Eastern time,
    # so a declined card can be chased the same day.
    schedule: "0 14,22 * * *"
    dockerCommand: python manage.py charge_due_instalments
    envVars:
      - fromGroup: travelweb-shared
      - key: DATABASE_URL
        fromDatabase:
          name: travelweb-db
          property: connectionString

  - type: cron
    name: staff-digest
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    # 14:30 UTC, after the morning instalment run has had time to finish.
    schedule: "30 14 * * *"
    dockerCommand: python manage.py send_staff_digest
    envVars:
      - fromGroup: travelweb-shared
      - key: DATABASE_URL
        fromDatabase:
          name: travelweb-db
          property: connectionString
