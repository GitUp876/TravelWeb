{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site_tagline }}{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{% url 'catalog:home' %}">{{ site_name }}</a>
      <nav aria-label="Trip categories">
        <ul class="nav">
          {% for category in categories %}
            <li><a href="{% url 'catalog:category' category.value %}">{{ category.label }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site_name }} — {{ site_tagline }}</p>
    </div>
  </footer>
</body>
</html>
